<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f7fb" />
    <title>Journal Operations | Finance Operations</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Main navigation">
        <a class="brand" href="#" aria-label="Journal Operations home" data-page="overview">
          <span class="brand-mark"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M7 7.5h18M7 13h12M7 18.5h18M7 24h10" /><circle cx="23" cy="13" r="2.5" /><circle cx="21" cy="24" r="2.5" /></svg></span>
          <span class="brand-copy"><strong>journal<span>ops</span></strong><small>FINANCE OPERATIONS</small></span>
        </a>

        <div class="workspace-switcher">
          <span class="workspace-icon">N</span>
          <span><strong>Northstar Group</strong><small>Finance workspace</small></span>
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 6 4 4 4-4" /></svg>
        </div>

        <div class="nav-label">WORKSPACE</div>
        <nav class="nav-list">
          <button class="nav-item active" data-page="overview"><span class="nav-icon"><svg viewBox="0 0 20 20"><rect x="2.5" y="2.5" width="6" height="6" rx="1.5"/><rect x="11.5" y="2.5" width="6" height="4" rx="1.5"/><rect x="11.5" y="8.5" width="6" height="9" rx="1.5"/><rect x="2.5" y="10.5" width="6" height="7" rx="1.5"/></svg></span>Executive overview</button>
          <button class="nav-item" data-page="processing"><span class="nav-icon"><svg viewBox="0 0 20 20"><path d="M4 4.5h12M4 9.5h12M4 14.5h8"/><circle cx="2.5" cy="4.5" r=".5"/><circle cx="2.5" cy="9.5" r=".5"/><circle cx="2.5" cy="14.5" r=".5"/></svg></span>Processing center<span class="nav-count" id="nav-backlog">4</span></button>
          <button class="nav-item" data-page="approvals"><span class="nav-icon"><svg viewBox="0 0 20 20"><path d="m4 10 4 4 8-8"/><circle cx="10" cy="10" r="8"/></svg></span>Approvals center<span class="nav-count alert" id="nav-approvals">3</span></button>
          <button class="nav-item" data-page="audit"><span class="nav-icon"><svg viewBox="0 0 20 20"><path d="M10 2.5 16 5v4.5c0 4-2.5 6.5-6 8-3.5-1.5-6-4-6-8V5l6-2.5Z"/><path d="m7.5 9.5 1.7 1.7 3.5-3.7"/></svg></span>Audit &amp; compliance</button>
          <button class="nav-item" data-page="architecture"><span class="nav-icon"><svg viewBox="0 0 20 20"><rect x="7" y="2.5" width="6" height="5" rx="1"/><rect x="2.5" y="12.5" width="6" height="5" rx="1"/><rect x="11.5" y="12.5" width="6" height="5" rx="1"/><path d="M10 7.5v2H5.5v3M10 9.5h4.5v3"/></svg></span>Solution architecture</button>
        </nav>

        <div class="nav-label agents-label">AI AGENTS <span class="live-dot"></span></div>
        <div class="agent-list">
          <button class="agent-link" data-page="processing"><span class="agent-dot intake"></span><span>Journal Intake</span><span class="agent-state">Active</span></button>
          <button class="agent-link" data-page="processing"><span class="agent-dot validation"></span><span>Validation</span><span class="agent-state">Active</span></button>
          <button class="agent-link" data-page="processing"><span class="agent-dot correction"></span><span>Correction</span><span class="agent-state">Active</span></button>
          <button class="agent-link" data-page="processing"><span class="agent-dot erp"></span><span>ERP Posting</span><span class="agent-state">Active</span></button>
        </div>

        <div class="sidebar-bottom">
          <div class="close-card"><span class="close-card-icon">✦</span><div><strong>September close</strong><small>Day 4 of 5 · On track</small></div><span class="close-chevron">↗</span><div class="close-progress"><i></i></div></div>
          <button class="nav-item help-link"><span class="nav-icon"><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="7.5"/><path d="M8 7.5a2.1 2.1 0 1 1 3.3 1.7c-.9.6-1.3 1-1.3 2"/><path d="M10 14.5h.01"/></svg></span>Help &amp; support</button>
          <div class="profile"><span class="avatar">AM</span><span><strong>Alex Morgan</strong><small>Finance controller</small></span><button aria-label="Profile options">···</button></div>
        </div>
      </aside>

      <main class="main-area">
        <header class="topbar">
          <div class="mobile-brand"><span class="brand-mark"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M7 7.5h18M7 13h12M7 18.5h18M7 24h10" /><circle cx="23" cy="13" r="2.5" /><circle cx="21" cy="24" r="2.5" /></svg></span><strong>journal<span>ops</span></strong></div>
          <div class="breadcrumbs"><span>Finance operations</span><span class="crumb-divider">/</span><strong id="page-crumb">Executive overview</strong></div>
          <div class="topbar-actions">
            <label class="global-search"><svg viewBox="0 0 20 20"><circle cx="8.8" cy="8.8" r="5.8"/><path d="m13.2 13.2 4 4"/></svg><input id="global-search" placeholder="Search journals..." aria-label="Search journals" /><kbd>⌘ K</kbd></label>
            <button class="icon-button theme-toggle" id="theme-toggle" aria-label="Toggle dark mode"><svg viewBox="0 0 20 20"><path d="M16.5 12.7A7.3 7.3 0 0 1 7.3 3.5a7.5 7.5 0 1 0 9.2 9.2Z"/><path d="M13.5 3v3M12 4.5h3"/></svg></button>
            <button class="icon-button notification-button" aria-label="Notifications"><svg viewBox="0 0 20 20"><path d="M15.5 8a5.5 5.5 0 0 0-11 0c0 6-2 6-2 7.5h15c0-1.5-2-1.5-2-7.5ZM8 18h4"/></svg><i></i></button>
          </div>
        </header>
        <div id="page-content" class="page-content"></div>
      </main>
    </div>

    <div id="overlay-root"></div>
    <div class="toast-region" id="toast-region" aria-live="polite"></div>
    <input class="upload-input" id="upload-file" type="file" accept=".xlsx,.xls,.pdf,.csv" />
    <script src="app.js"></script>
  </body>
</html>
